[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pfmls"
version = "0.1.0"
description = "A level set method on particle flow maps (PFM-LS) in NVIDIA Warp: 2D and 3D level sets, the paper's benchmarks and 2D water examples"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jinjin He" }]
requires-python = ">=3.10"
keywords = ["level set", "particle flow map", "interface tracking", "free-surface flow", "NVIDIA Warp", "GPU"]
dependencies = [
    "warp-lang>=1.8",
    "numpy",
    "scipy",
    "scikit-image",
    "matplotlib",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/jinjinhe2001/Particle-Flowmap-Levelset"
Documentation = "https://github.com/jinjinhe2001/Particle-Flowmap-Levelset/tree/main/docs"
Issues = "https://github.com/jinjinhe2001/Particle-Flowmap-Levelset/issues"

[tool.setuptools.packages.find]
include = ["pfmls*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires a CUDA device (added automatically, see tests/conftest.py)"]
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage.*"]
